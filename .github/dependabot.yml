version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /native/qwen3-tts-bench
      - /native/qwen3-tts-http-bench
      - /native/qwen3-tts-native
      - /native/qwen3-tts-native-codec
      - /native/qwen3-tts-runtime
      - /native/qwen3-tts-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /benchmarks/baselines/sglang-omni
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
